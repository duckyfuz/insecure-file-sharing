<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>IFS - Insecure File Service</title>
    <meta
      name="description"
      content="Insecurely transfer files between devices connected to the internet."
    />
    <meta
      name="keywords"
      content="file sharing, file transfer, online file sharing, share files online"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ifs-app.kenf.dev/" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="./${styles_asset_path}" />
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>
    ${analytics_script}
  </head>

  <body>
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">
      <svg
        class="sun-icon"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        width="20"
        height="20"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"
        />
      </svg>
      <svg
        class="moon-icon"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        width="20"
        height="20"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"
        />
      </svg>
    </button>

    <div class="container">
      <div class="panel">
        <h2>upload file</h2>
        <div class="upload-area" id="uploadArea">
          <div class="upload-icon">📤</div>
          <p>drag & drop your file here<br />or click to browse</p>
          <input type="file" id="fileInput" class="file-input" />
        </div>

        <div class="prefix-group">
          <label for="prefixInput" class="prefix-label"
            >custom prefix
            <span class="prefix-optional">(optional)</span></label
          >
          <input
            type="text"
            id="prefixInput"
            class="search-input prefix-input"
            placeholder="e.g. my-project"
            maxlength="32"
          />
          <p class="prefix-hint">
            example code: <strong id="prefixPreview">4f7a</strong>
          </p>
        </div>

        <!-- Cloudflare Turnstile Widget -->
        <div
          class="cf-turnstile"
          data-sitekey="${turnstile_site_key}"
          data-callback="turnstileCallback"
        ></div>
        <br />

        <button id="uploadButton" class="button" disabled>upload file</button>
        <div id="progressContainer" class="progress-container">
          <div class="progress-track">
            <div id="progressBar" class="progress-bar"></div>
          </div>
          <div id="progressInfo" class="progress-info">
            <span id="progressPercent">0%</span>
            <span id="progressSize"></span>
            <span id="progressSpeed"></span>
          </div>
        </div>
        <div id="output" class="output"></div>
      </div>

      <div class="divider"></div>

      <div class="panel">
        <h2>access shared file</h2>
        <input
          type="text"
          id="fileNameInput"
          class="search-input"
          placeholder="enter a file code, for example: 4f7a or my-project-4f7a"
        />
        <button
          id="accessFileButton"
          class="button"
          disabled
        >
          access file
        </button>
      </div>
    </div>

    <script>
      window.IFS_CONFIG = {
        apiUrl: "${api_url}",
      };
    </script>
    <script src="./${app_asset_path}" defer></script>
    <footer>
      <p>
        this was made by an indie developer. explore some other projects at
        <a
          href="https://www.kenf.dev"
          target="_blank"
          rel="noopener noreferrer"
        >
          www.kenf.dev </a
        >.
      </p>
    </footer>
  </body>
</html>
